<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clics - DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Interactividad con el DOM</h1>
        <p class="description">Haz clic en el botón para incrementar el contador y registrar la hora exacta del evento en la tabla.</p>
        
        <div id="contador" class="counter-box">0</div>
        
        <button id="btn-like" class="btn-click">¡Haz Clic Aquí!</button>
        <button id="btn-disminuir" class="btn-click" style="background-color: #e74c3c;">Restar (-1)</button>
        <button id="btn-reset" class="btn-click" style="background-color: #95a5a6;">Reiniciar (0)</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="cell-numero">Nº Clic</th>
                        <th class="cell-hora">Hora</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <!-- Las filas se insertarán dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
